<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Teleprompter leve e offline para celular Android acima da câmera, com controle de velocidade e avanço por reconhecimento de voz.">
  <title>PromptCam — Teleprompter</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top HUD -->
    <header id="top-hud" class="hud top-hud">
      <button
        id="btn-open-editor"
        type="button"
        class="pill-btn script-pill"
        command="show-modal"
        commandfor="editor-dialog"
        aria-label="Editar roteiro"
        title="Editar roteiro"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20h9M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="active-script-title" class="script-pill-title">Carregando...</span>
      </button>

      <div id="voice-chip" class="voice-chip" hidden aria-live="off">
        <span class="voice-dot" aria-hidden="true"></span>
        <span id="voice-chip-text" class="voice-chip-text">Ouvindo...</span>
      </div>

      <div class="top-actions">
        <button id="btn-install-app" type="button" class="pill-btn install-btn" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Instalar</span>
        </button>

        <button
          id="btn-settings"
          type="button"
          class="icon-btn settings-trigger"
          popovertarget="settings-sheet"
          aria-label="Ajustes de texto e exibição"
          title="Ajustes de leitura"
        >
          <span class="aa-glyph" aria-hidden="true">Aa</span>
        </button>
      </div>
    </header>

    <!-- Teleprompter Stage -->
    <main id="stage-shell" class="stage-shell">
      <div id="focus-guide" class="focus-guide" aria-hidden="true">
        <span class="focus-chevron focus-chevron-left">▸</span>
        <span class="focus-band"></span>
        <span class="focus-chevron focus-chevron-right">◂</span>
      </div>

      <div
        id="prompter-stage"
        class="prompter-stage"
        tabindex="0"
        aria-label="Texto do teleprompter"
      >
        <article id="script-content" class="script-content" data-mirrored="false"></article>
      </div>

      <div id="countdown-overlay" class="countdown-overlay" hidden aria-live="assertive">
        <span id="countdown-value" class="countdown-value">3</span>
        <span class="countdown-hint">Toque para cancelar</span>
      </div>
    </main>

    <!-- Bottom Floating Control Dock -->
    <footer id="bottom-hud" class="hud bottom-hud">
      <div
        id="main-toolbar"
        role="toolbar"
        focusgroup="toolbar wrap"
        aria-label="Controles do teleprompter"
        aria-controls="prompter-stage"
        class="control-dock"
      >
        <div role="group" aria-label="Reprodução" class="toolbar-group">
          <button
            id="btn-reset"
            type="button"
            class="icon-btn"
            aria-label="Voltar ao início"
            title="Voltar ao início (R)"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button
            id="btn-play"
            type="button"
            class="play-btn"
            aria-label="Iniciar rolagem"
            title="Iniciar ou pausar (Espaço)"
          >
            <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="7 4 20 12 7 20 7 4" fill="currentColor"/>
            </svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
              <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
            </svg>
          </button>

          <button
            id="btn-voice"
            type="button"
            class="icon-btn voice-btn"
            aria-pressed="false"
            aria-label="Avanço por voz"
            title="Avanço por voz (V)"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <span role="separator" aria-orientation="vertical" class="toolbar-sep"></span>

        <div role="group" aria-label="Velocidade" class="toolbar-group speed-group">
          <button
            id="btn-speed-down"
            type="button"
            class="icon-btn compact-btn"
            aria-label="Diminuir velocidade"
            title="Diminuir velocidade (Seta esquerda)"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </button>

          <button
            id="speed-readout"
            type="button"
            class="speed-readout"
            popovertarget="settings-sheet"
            aria-label="Velocidade atual: 3.0. Abrir ajustes"
            title="Ajustar velocidade"
          >3.0x</button>

          <button
            id="btn-speed-up"
            type="button"
            class="icon-btn compact-btn"
            aria-label="Aumentar velocidade"
            title="Aumentar velocidade (Seta direita)"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Live Status Announcements (outside toolbar) -->
    <p id="live-status" class="sr-only" role="status" aria-live="polite"></p>
  </div>

  <!-- Non-Modal Live Settings Sheet -->
  <dialog id="settings-sheet" popover="auto" aria-labelledby="settings-title" class="settings-sheet">
    <div class="sheet-header">
      <h2 id="settings-title">Ajustes de Leitura</h2>
      <button
        type="button"
        class="icon-btn"
        popovertarget="settings-sheet"
        popovertargetaction="hide"
        aria-label="Fechar ajustes"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="sheet-body">
      <div class="settings-grid">
        <div class="control-card">
          <div class="control-label-row">
            <label for="range-font-size">Tamanho da fonte</label>
            <output id="val-font-size" for="range-font-size">44 px</output>
          </div>
          <input type="range" id="range-font-size" min="20" max="96" step="2" value="44">
        </div>

        <div class="control-card">
          <div class="control-label-row">
            <label for="range-line-height">Entrelinha</label>
            <output id="val-line-height" for="range-line-height">1.45</output>
          </div>
          <input type="range" id="range-line-height" min="1.1" max="2.4" step="0.05" value="1.45">
        </div>

        <div class="control-card">
          <div class="control-label-row">
            <label for="range-speed">Velocidade automática</label>
            <output id="val-speed" for="range-speed">3.0x</output>
          </div>
          <input type="range" id="range-speed" min="0.5" max="10" step="0.25" value="3">
        </div>

        <div class="control-card">
          <div class="control-label-row">
            <label for="range-margin">Margem lateral</label>
            <output id="val-margin" for="range-margin">10%</output>
          </div>
          <input type="range" id="range-margin" min="4" max="34" step="2" value="10">
        </div>

        <div class="control-card">
          <div class="control-label-row">
            <label for="range-focus-line">Linha de foco (câmera)</label>
            <output id="val-focus-line" for="range-focus-line">42%</output>
          </div>
          <input type="range" id="range-focus-line" min="15" max="75" step="1" value="42">
        </div>

        <div class="control-card select-grid-card">
          <div class="select-field">
            <label for="select-countdown">Contagem inicial</label>
            <select id="select-countdown">
              <option value="0">Sem contagem</option>
              <option value="3" selected>3 segundos</option>
              <option value="5">5 segundos</option>
            </select>
          </div>

          <div class="select-field">
            <label for="select-voice-lang">Idioma da voz</label>
            <select id="select-voice-lang">
              <option value="pt-BR" selected>Português (BR)</option>
              <option value="pt-PT">Português (PT)</option>
              <option value="en-US">English (US)</option>
              <option value="es-ES">Español</option>
            </select>
          </div>

          <div class="select-field">
            <label for="select-theme">Tema visual</label>
            <select id="select-theme">
              <option value="oled" selected>OLED Preto Puro</option>
              <option value="studio">Estúdio Escuro</option>
              <option value="contrast">Alto Contraste (Amarelo)</option>
            </select>
          </div>
        </div>

        <div class="control-card switches-card">
          <label class="switch-row" for="switch-mirror">
            <span>Espelhar texto (horizontal)</span>
            <input id="switch-mirror" type="checkbox" switch>
          </label>

          <label class="switch-row" for="switch-guide">
            <span>Mostrar guia de leitura</span>
            <input id="switch-guide" type="checkbox" switch checked>
          </label>

          <label class="switch-row" for="switch-wakelock">
            <span>Manter tela ligada (Wake Lock)</span>
            <input id="switch-wakelock" type="checkbox" switch checked>
          </label>

          <label class="switch-row" for="switch-autohide">
            <span>Ocultar controles ao gravar</span>
            <input id="switch-autohide" type="checkbox" switch checked>
          </label>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Modal Script Editor & Library -->
  <dialog id="editor-dialog" closedby="any" aria-labelledby="editor-title" class="editor-dialog">
    <div class="editor-header">
      <h2 id="editor-title">Roteiros</h2>
      <div class="editor-header-actions">
        <button id="btn-new-script" type="button" class="pill-btn small-pill">+ Novo</button>
        <button id="btn-import-script" type="button" class="pill-btn small-pill">Importar .txt</button>
        <input id="file-import" type="file" accept=".txt,text/plain" hidden>
        <button id="btn-export-script" type="button" class="pill-btn small-pill">Exportar .txt</button>
        <button
          id="btn-close-editor"
          type="button"
          class="icon-btn"
          command="close"
          commandfor="editor-dialog"
          aria-label="Fechar roteiros"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="script-list" class="script-list" role="listbox" aria-label="Roteiros salvos"></div>

    <div class="editor-fields">
      <label class="sr-only" for="script-title-input">Título do roteiro</label>
      <input
        id="script-title-input"
        type="text"
        class="title-input"
        placeholder="Título do roteiro"
        maxlength="80"
        autocomplete="off"
      >

      <label class="sr-only" for="script-textarea">Texto do roteiro</label>
      <textarea
        id="script-textarea"
        class="script-textarea"
        placeholder="Cole ou escreva seu roteiro aqui. Separe parágrafos com Enter..."
        autofocus
      ></textarea>

      <div class="editor-meta">
        <p id="script-stats" class="script-stats">0 palavras · ~0 min</p>
      </div>
    </div>

    <div class="editor-footer">
      <div class="editor-footer-left">
        <button id="btn-delete-script" type="button" class="text-btn danger-btn">Excluir</button>
        <button id="btn-restore-sample" type="button" class="text-btn">Exemplo</button>
      </div>
      <button
        id="btn-apply-script"
        type="button"
        class="primary-btn"
        command="close"
        commandfor="editor-dialog"
      >Aplicar e Ler</button>
    </div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
